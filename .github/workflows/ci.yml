name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # CI-only throwaway passwords from the example file; the container lives for this job only.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start SQL Server and run db-init
        run: |
          docker compose up -d
          code=$(docker wait harbor-db-init)
          docker logs harbor-db-init | tail -20
          test "$code" = "0"

      - name: Test
        run: dotnet test -m:1 --logger "console;verbosity=normal"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
