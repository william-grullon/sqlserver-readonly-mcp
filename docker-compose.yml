services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: harbor-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: waits for the healthcheck, runs db/setup.sql, exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: harbor-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    working_dir: /db
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MCP_READER_PASSWORD: ${MCP_READER_PASSWORD:?set MCP_READER_PASSWORD in .env}
    volumes:
      - ./db:/db:ro
    command:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -I -i /db/setup.sql -v McpReaderPassword="$$MCP_READER_PASSWORD"

  # Phase 5 variant (opt-in): Data API Builder's built-in SQL MCP server over the same views.
  #   docker compose --profile dab up -d dab      ->  http://localhost:5000/mcp
  dab:
    profiles: ["dab"]
    image: mcr.microsoft.com/azure-databases/data-api-builder:2.1.7
    container_name: harbor-dab
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      # Same read-only login as the .NET server; never sa.
      DAB_CONNECTION_STRING: Server=sqlserver,1433;Database=HarborSupply;User Id=mcp_reader;Password=${MCP_READER_PASSWORD:?set MCP_READER_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True
    volumes:
      - ./dab/dab-config.json:/App/dab-config.json:ro
    ports:
      - "${DAB_PORT:-5000}:5000"

volumes:
  sqlserver-data:
